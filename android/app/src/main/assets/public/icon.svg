<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Rounded Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="6"/>

  <!-- Neon Equalizer Wave Silhouette -->
  <g filter="url(#glow)">
    <!-- Bar 1 -->
    <rect x="90" y="270" width="28" height="90" rx="14" fill="#10b981" />
    <!-- Bar 2 -->
    <rect x="134" y="200" width="28" height="160" rx="14" fill="#10b981" />
    <!-- Bar 3 -->
    <rect x="178" y="140" width="28" height="220" rx="14" fill="#38bdf8" />
    <!-- Bar 4 (Center Peak) -->
    <rect x="222" y="90" width="28" height="270" rx="14" fill="url(#pulseGrad)" />
    <!-- Bar 5 -->
    <rect x="266" y="120" width="28" height="240" rx="14" fill="url(#pulseGrad)" />
    <!-- Bar 6 -->
    <rect x="310" y="180" width="28" height="180" rx="14" fill="#38bdf8" />
    <!-- Bar 7 -->
    <rect x="354" y="230" width="28" height="130" rx="14" fill="#10b981" />
    <!-- Bar 8 -->
    <rect x="398" y="290" width="28" height="70" rx="14" fill="#10b981" />
  </g>

  <!-- Reflection baseline dots -->
  <circle cx="104" cy="388" r="4" fill="#10b981" opacity="0.6"/>
  <circle cx="148" cy="388" r="5" fill="#10b981" opacity="0.6"/>
  <circle cx="192" cy="388" r="6" fill="#38bdf8" opacity="0.7"/>
  <circle cx="236" cy="388" r="7" fill="#f59e0b" opacity="0.9"/>
  <circle cx="280" cy="388" r="7" fill="#f59e0b" opacity="0.9"/>
  <circle cx="324" cy="388" r="6" fill="#38bdf8" opacity="0.7"/>
  <circle cx="368" cy="388" r="5" fill="#10b981" opacity="0.6"/>
  <circle cx="412" cy="388" r="4" fill="#10b981" opacity="0.6"/>
</svg>
